name: Build, verify, and test

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Android emulator API level
        required: true
        default: "37"
        type: choice
        options:
          - "28"
          - "33"
          - "34"
          - "37"
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    name: Verify flavors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Run flavor unit tests
        run: ./gradlew :app:testMiCTSDebugUnitTest :app:testVISTriggerDebugUnitTest --no-parallel

      - name: Lint both flavors
        run: ./gradlew :app:lintMiCTSDebug :app:lintVISTriggerDebug --no-parallel

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleMiCTSDebug :app:assembleVISTriggerDebug --no-parallel

      - name: Check APK identities and non-root isolation
        run: |
          set -euo pipefail
          micts_apk=app/build/outputs/apk/MiCTS/debug/app-MiCTS-debug.apk
          vistrigger_apk=app/build/outputs/apk/VISTrigger/debug/app-VISTrigger-debug.apk
          test -f "$micts_apk"
          test -f "$vistrigger_apk"

          for apk in "$micts_apk" "$vistrigger_apk"; do
            if unzip -l "$apk" | grep 'META-INF/xposed/' > /dev/null; then
              echo "$apk must not contain Xposed metadata."
              exit 1
            fi
            if unzip -p "$apk" 'classes*.dex' | strings | grep 'io/github/libxposed' > /dev/null; then
              echo "$apk must not contain the libxposed runtime or API."
              exit 1
            fi
          done

          if unzip -p "$vistrigger_apk" 'classes*.dex' | strings | grep -E 'com/parallelc/micts/(ModuleMain|hooker/|config/XposedConfig|capture/|data/(Ai|Capture|Compatibility|LensShare|ProjectionConsent|TextRecognition|TriggerPreference|TriggerSettings)|domain/(AiModels|AutoResolution|Capture|Compatibility|CropGeometry|RecognitionModels|TriggerAction|TriggerCoordinator|TriggerStrategy)|ui/activity/(CropActivity|FallbackActivity|LensFallbackActivity)|ui/viewmodel/CropViewModel)' > /dev/null; then
            echo "VISTrigger APK contains removed module, editor, capture, or fallback code."
            exit 1
          fi

          apkanalyzer="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer" ]; then
            apkanalyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n 1)"
          fi
          test -x "$apkanalyzer"
          test "$("$apkanalyzer" manifest application-id "$micts_apk")" = "com.parallelc.micts"
          test "$("$apkanalyzer" manifest application-id "$vistrigger_apk")" = "com.parallelc.vistrigger"

          micts_manifest="$("$apkanalyzer" manifest print "$micts_apk")"
          vistrigger_manifest="$("$apkanalyzer" manifest print "$vistrigger_apk")"
          grep -q 'ScreenCaptureService' <<< "$micts_manifest"
          grep -q 'androidx.core.content.FileProvider' <<< "$micts_manifest"
          if grep -Eq 'ScreenCaptureService|androidx.core.content.FileProvider|FOREGROUND_SERVICE_MEDIA_PROJECTION|de.robv.android.xposed' <<< "$vistrigger_manifest"; then
            echo "VISTrigger manifest contains MiCTS capture or Xposed components."
            exit 1
          fi

  connected-tests:
    name: Connected tests (API ${{ inputs.api_level }})
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run connected flavor tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: default
          arch: x86_64
          profile: pixel_2
          script: ./gradlew :app:connectedMiCTSDebugAndroidTest :app:connectedVISTriggerDebugAndroidTest --no-parallel

  release:
    name: Signed release artifacts
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Configure release signing
        id: signing
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VARIANT=Release
          SIGNED=true
          if [ -z "$KEY_STORE_BASE64" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets missing; falling back to debug-signed minified sideload builds."
            VARIANT=Sideload
            SIGNED=false
          else
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEY_STORE_BASE64" | base64 --decode > "$keystore"
            {
              echo "ORG_GRADLE_PROJECT_androidStoreFile=$keystore"
              echo "ORG_GRADLE_PROJECT_androidStorePassword=$KEY_STORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_androidKeyAlias=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_androidKeyPassword=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Build minified release APKs
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          if [ "$VARIANT" = "Sideload" ]; then
            ./gradlew :app:assembleMiCTS$VARIANT :app:assembleVISTrigger$VARIANT --no-parallel
          else
            ./gradlew :app:assembleMiCTSRelease :app:assembleVISTriggerRelease --no-parallel
          fi

      - name: Verify signatures and rename artifacts
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          mkdir -p dist
          variant_dir="$(tr '[:upper:]' '[:lower:]' <<< "$VARIANT")"
          flavor_suffix="$(tr '[:upper:]' '[:lower:]' <<< "${VARIANT:0:1}")${VARIANT:1}"
          for flavor in MiCTS VISTrigger; do
            output_dir="app/build/outputs/apk/$flavor/$variant_dir"
            metadata="$output_dir/output-metadata.json"
            test -f "$metadata"
            apk_file="$(jq -r '.elements[0].outputFile' "$metadata")"
            version_name="$(jq -r '.elements[0].versionName' "$metadata")"
            version_code="$(jq -r '.elements[0].versionCode' "$metadata")"
            apk="$output_dir/$apk_file"
            "$apksigner" verify --verbose --print-certs "$apk" || echo "Unsigned APK (sideload fallback)"
            label="release"
            [ "$SIGNED" = "false" ] && label="sideload"
            cp "$apk" "dist/${flavor}-${version_name}-${version_code}-${label}.apk"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-apks-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.apk
