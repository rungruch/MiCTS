version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      android-toolchain:
        patterns:
          - com.android.*
          - org.jetbrains.kotlin.*
          - org.gradle.*
      androidx-compose:
        patterns:
          - androidx.activity:*
          - androidx.compose:*
          - androidx.lifecycle:*
          - com.google.android.material:*
      libxposed:
        patterns:
          - io.github.libxposed:*
